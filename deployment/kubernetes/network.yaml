apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-dependencies
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [cron, pdf-layout, redis, milvus]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: milvus-storage
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [etcd, minio]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: milvus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-ingest
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
      ports:
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-ingest
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - port: 4318
